name: Rooms checks
on:
  push:
    branches: [main, feat/rooms-agentic]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rooms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Fetch checksum-pinned BOSS SDK
        run: python3 scripts/fetch-sdk.py
      - name: Install backend test dependency
        run: npm ci --prefix backend
      - name: SQL permissions and isolated HTTP persistence tests
        run: |
          npm test --prefix backend
          node backend/local-server.test.mjs
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libxrender1 libxtst6
      - name: Build and test native plugin
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ./gradlew --no-daemon test buildPluginJar buildLocalDemoPlugin
          else
            ./gradlew --no-daemon test buildPluginJar buildLocalDemoPlugin
          fi
      - name: Verify production artifact separation
        run: python3 scripts/verify-artifact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rooms-validation-${{ matrix.os }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/ui-screenshots/
            build/libs/boss-plugin-rooms-0.1.0.jar
